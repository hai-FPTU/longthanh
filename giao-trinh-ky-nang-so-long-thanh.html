<style>
/* Hệ thống màu, chữ và thành phần cơ bản. Màu chủ đạo: mực xanh đen của văn bản hành chính và đỏ con dấu. */
:root {
  color-scheme: light;
  --paper: #F2F4F7; --surface: #FFFFFF; --sunk: #F7F8FA;
  --ink: #15233B; --ink-2: #45526B; --ink-3: #6F7B90;
  --line: #DCE1E9; --line-2: #C3CBD7;
  --seal: #B4152B; --seal-soft: #FBE9EC;
  --safe: #0C6B57; --safe-soft: #E1F1EC;
  --warn: #9A5B00; --warn-soft: #FCF0DA;
  --navy: #1E3A6B; --navy-soft: #E7ECF6;
  --focus: #2F66E0;
  --l0: #0C6B57; --l1: #1E3A6B; --l2: #9A5B00; --l3: #B4152B;
  --scene-wall: #E9EDF3; --scene-floor: #D5DBE4;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --font: "Be Vietnam Pro", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
  --fs: 17px;
}
*, *::before, *::after { box-sizing: border-box; }
html { font-size: var(--fs); scroll-padding-top: 76px; -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--paper); line-height: 1.62; -webkit-font-smoothing: antialiased; }
body.projector { --fs: 21px; }
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .55em; font-weight: 700; letter-spacing: -.01em; }
h1 { font-size: clamp(1.7rem, 3.4vw, 2.35rem); font-weight: 800; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.18rem; }
h4 { font-size: 1.04rem; }
p { margin: 0 0 .85em; }
a { color: var(--navy); text-underline-offset: 3px; }
img, svg { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.muted { color: var(--ink-3); }
.small { font-size: .85rem; }
.ok { color: var(--safe); } .bad { color: var(--seal); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 8px; z-index: 100; background: #fff; padding: .5em 1em; border-radius: var(--r-sm); }
.skip:focus { left: 12px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: 44px; padding: .5em 1.1em; border-radius: var(--r-sm); border: 1.5px solid var(--ink); background: var(--ink); color: #fff; font-weight: 600; text-decoration: none; line-height: 1.25; transition: background .15s, transform .1s; }
.btn:hover { background: #22375A; }
.btn:active { transform: translateY(1px); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn-ghost:hover { background: var(--navy-soft); }
.btn-seal { background: var(--seal); border-color: var(--seal); } .btn-seal:hover { background: #95101F; }
.btn-safe { background: var(--safe); border-color: var(--safe); } .btn-safe:hover { background: #09574A; }
.btn-sm { min-height: 38px; padding: .35em .85em; font-size: .9rem; }
.btn[disabled], .btn:disabled { opacity: .45; cursor: not-allowed; }

.chip { display: inline-flex; align-items: center; padding: .45em .8em; border-radius: 999px; border: 1.5px solid var(--line-2); background: var(--surface); font-size: .92rem; line-height: 1.3; text-align: left; }
.chip:hover { border-color: var(--ink-2); }
.chip-sm { font-size: .82rem; padding: .3em .7em; }

/* Con dấu – dấu ấn thị giác chủ đạo của giáo trình */
.stamp { position: absolute; right: 5%; top: 14%; z-index: 6; padding: .15em .6em; border: 4px solid currentColor; border-radius: 8px; font-weight: 800; font-size: clamp(1.2rem, 3vw, 1.9rem); letter-spacing: .06em; text-transform: uppercase; background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 2px rgba(255,255,255,.9), inset 0 0 0 5px currentColor; transform: rotate(-11deg); pointer-events: none; animation: stamp-in .5s cubic-bezier(.2,.9,.3,1.25) both; white-space: nowrap; }
.stamp-bad { color: var(--seal); } .stamp-good { color: var(--safe); } .stamp-warn { color: var(--warn); }
@keyframes stamp-in { 0% { transform: rotate(-11deg) scale(2.6); opacity: 0; } 55% { transform: rotate(-11deg) scale(.93); opacity: 1; } 100% { transform: rotate(-11deg) scale(1); opacity: .93; } }

#toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 140%); background: var(--ink); color: #fff; padding: .7em 1.2em; border-radius: var(--r-md); max-width: min(560px, 92vw); z-index: 90; transition: transform .25s; font-size: .95rem; }
#toast.show { transform: translate(-50%, 0); }
#toast.ok { background: var(--safe); } #toast.bad { background: var(--seal); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
#toast:not(.show) { visibility: hidden; }
main:focus, main:focus-visible { outline: none; }

</style>
<style>
/* Khung trang: thanh trên, thanh bên, vùng nội dung. */
.topbar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: .9rem; min-height: 60px; padding: env(safe-area-inset-top, 0) 1.1rem 0; background: var(--ink); color: #fff; }
.brand { display: flex; align-items: center; gap: .65rem; color: #fff; text-decoration: none; font-weight: 700; font-size: .98rem; line-height: 1.2; }
.brand small { display: block; font-weight: 400; color: #B6C1D5; font-size: .76rem; }
.spacer { flex: 1; }
.progress-pill { font-size: .82rem; color: #C9D3E4; }
.pj-btn { background: transparent; color: #fff; border: 1.5px solid #4A5D80; border-radius: var(--r-sm); padding: .35em .8em; font-size: .85rem; min-height: 38px; }
.pj-btn[aria-pressed="true"] { background: #fff; color: var(--ink); border-color: #fff; }
.menu-btn { display: none; background: none; border: 0; color: #fff; padding: 8px; min-width: 44px; min-height: 44px; }

.shell { display: grid; grid-template-columns: 310px minmax(0, 1fr); min-height: calc(100vh - 60px); }
.sidebar { position: sticky; top: 60px; height: calc(100vh - 60px); overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 1rem .8rem 2.5rem; }
.nav-group { margin-bottom: .6rem; }
.nav-group h2 { font-size: .8rem; font-weight: 600; color: var(--ink-3); margin: 1rem .6rem .35rem; letter-spacing: 0; }
.nav-link { display: grid; grid-template-columns: 1.9rem 1fr; gap: .55rem; align-items: start; padding: .5rem .55rem; border-radius: var(--r-sm); color: var(--ink); text-decoration: none; font-size: .9rem; line-height: 1.35; }
.nav-link:hover { background: var(--sunk); }
.nav-link[aria-current="page"] { background: var(--navy-soft); font-weight: 600; }
.nav-t small { display: block; color: var(--ink-3); font-weight: 400; font-size: .76rem; margin-top: 2px; }
.nav-num { display: inline-grid; place-items: center; width: 1.75rem; height: 1.75rem; border-radius: 50%; border: 1.5px solid var(--line-2); font-size: .8rem; font-weight: 700; color: var(--ink-2); }
.nav-dot { width: .6rem; height: .6rem; margin: .45rem .55rem 0; border: 0; background: var(--line-2); }
.nav-link.done .nav-num { background: var(--safe); border-color: var(--safe); color: #fff; }
.nav-link.done .nav-dot { background: var(--safe); }

main { padding: 2.2rem clamp(1rem, 4vw, 3.2rem) 5rem; min-width: 0; outline: none; }
.page { max-width: 960px; margin: 0 auto; }
body.projector .page { max-width: 1180px; }

@media (max-width: 980px) {
  .shell { grid-template-columns: 1fr; }
  .menu-btn { display: inline-flex; }
  .sidebar { position: fixed; left: 0; top: 60px; width: min(330px, 88vw); z-index: 35; transform: translateX(-102%); transition: transform .25s; box-shadow: 8px 0 30px rgba(21,35,59,.18); }
  body.nav-open .sidebar { transform: none; }
  .progress-pill { display: none; }
}
@media (max-width: 560px) {
  .brand small { display: none; }
  .brand span { font-size: .88rem; }
  .pj-btn { display: none; }
  main { padding-top: 1.4rem; }
}

.nav-ver { margin: 1.2rem .6rem 0; font-size: .74rem; color: var(--ink-3); }

</style>
<style>
/* Nội dung chủ đề, trang chủ, trang pháp lý, kiểm tra. */
.topic-head { margin-bottom: 1.8rem; }
.topic-meta { display: flex; flex-wrap: wrap; gap: .4rem 1.1rem; font-size: .86rem; color: var(--ink-2); margin-bottom: .9rem; }
.sess { font-weight: 700; padding: .1em .6em; border-radius: 4px; }
.sess-am { background: var(--warn-soft); color: var(--warn); }
.sess-pm { background: var(--navy-soft); color: var(--navy); }
.topic-idx { font-weight: 600; color: var(--seal); margin-bottom: .3rem; }
.lead { font-size: 1.12rem; color: var(--ink-2); max-width: 68ch; }
.goals { margin-top: 1rem; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.goals summary { cursor: pointer; padding: .7rem 1rem; font-weight: 600; font-size: .95rem; }

.hook { position: relative; background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--seal); border-radius: var(--r-md); padding: 1.3rem 1.5rem; margin: 0 0 2.4rem; }

.blk { margin: 0 0 2.6rem; }
.blk > h2 { padding-top: .2rem; }
.blk-prose p { max-width: 72ch; }
.points { margin: 0; display: grid; gap: .1rem; }
.pt { display: grid; grid-template-columns: minmax(10rem, 15rem) 1fr; gap: 1.2rem; padding: .85rem 0; border-top: 1px solid var(--line); }
.pt:last-child { border-bottom: 1px solid var(--line); }
.pt dt { font-weight: 700; }
.pt dd { margin: 0; color: var(--ink-2); }
@media (max-width: 640px) { .pt { grid-template-columns: 1fr; gap: .2rem; } }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.tbl { width: 100%; border-collapse: collapse; font-size: .94rem; min-width: 600px; }
.tbl th { text-align: left; background: var(--sunk); padding: .7rem .9rem; font-size: .85rem; color: var(--ink-2); border-bottom: 1px solid var(--line); }
.tbl td { padding: .8rem .9rem; border-top: 1px solid var(--line); vertical-align: top; }
.tbl-note { font-size: .9rem; color: var(--ink-2); margin-top: .8rem; padding-left: .9rem; border-left: 3px solid var(--warn); }
.lvl { display: inline-block; font-weight: 700; padding: .1em .55em; border-radius: 4px; white-space: nowrap; border: 1.5px solid currentColor; }
.lvl-0 { color: var(--l0); } .lvl-1 { color: var(--l1); } .lvl-2 { color: var(--l2); } .lvl-3 { color: var(--l3); background: var(--seal-soft); }

.note { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 1.2rem 1.4rem; }
.note-law { border-left: 6px solid var(--navy); }
.note-law > h2::before { content: "§ "; color: var(--navy); }
.note-warn { border-left: 6px solid var(--warn); background: var(--warn-soft); }
.note h2 { font-size: 1.08rem; }

.rules { border-radius: var(--r-md); padding: 1.2rem 1.4rem; border: 1px solid var(--line); background: var(--surface); }
.rules h2 { font-size: 1.1rem; }
.rules ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .55rem; }
.rules li { position: relative; padding-left: 2rem; }
.rules li::before { position: absolute; left: 0; top: .08em; width: 1.35rem; height: 1.35rem; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; font-weight: 800; color: #fff; }
.rules-dont { border-top: 5px solid var(--seal); } .rules-dont li::before { content: "✕"; background: var(--seal); }
.rules-do { border-top: 5px solid var(--safe); } .rules-do li::before { content: "✓"; background: var(--safe); }
.rules-must { border-top: 5px solid var(--navy); } .rules-must li::before { content: "!"; background: var(--navy); }

.takeaways { background: var(--ink); color: #fff; border-radius: var(--r-lg); padding: 1.6rem 1.8rem; margin: 3rem 0 2rem; }
.takeaways h2 { color: #fff; }
.takeaways ol { margin: 0 0 1rem; padding-left: 1.3rem; display: grid; gap: .45rem; }
.takeaways .reflect { margin: 0; padding-top: 1rem; border-top: 1px solid #3A4C6E; color: #D5DDEA; }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.pg { display: block; padding: 1rem 1.2rem; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); text-decoration: none; color: var(--ink); font-weight: 600; line-height: 1.35; }
.pg small { display: block; color: var(--ink-3); font-weight: 400; font-size: .8rem; margin-bottom: .2rem; }
.pg-next { text-align: right; }
.pg:hover { border-color: var(--ink-2); }

/* Trang chủ */
.hero { display: grid; grid-template-columns: 1.05fr .95fr; gap: 2.4rem; align-items: center; margin-bottom: 3.2rem; }
.hero-org { font-weight: 700; color: var(--seal); margin-bottom: .4rem; }
.hero h1 { font-size: clamp(1.9rem, 3.9vw, 2.7rem); line-height: 1.12; letter-spacing: -.02em; margin-bottom: .7rem; }
.hero-h1-2 { display: block; font-size: .62em; font-weight: 700; color: var(--ink-2); letter-spacing: -.01em; margin-top: .3em; }
.hero-sub { font-size: 1.08rem; color: var(--ink-2); }
.hero-facts { margin: 1.2rem 0 1.4rem; display: grid; gap: .5rem; }
.hero-facts div { display: grid; grid-template-columns: 6.5rem 1fr; gap: .8rem; font-size: .95rem; }
.hero-facts dt { color: var(--ink-3); } .hero-facts dd { margin: 0; font-weight: 600; }
.hero-cta { display: flex; flex-wrap: wrap; gap: .7rem; }
.hero-mail { position: relative; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); padding: 0 1.2rem 1.1rem; box-shadow: 0 18px 40px -22px rgba(21,35,59,.35); font-size: .93rem; }
.hm-bar { display: flex; gap: 6px; padding: .8rem 0; border-bottom: 1px solid var(--line); margin-bottom: .8rem; }
.hm-bar span { width: 10px; height: 10px; border-radius: 50%; background: var(--line-2); }
.hm-row { margin-bottom: .4rem; }
.hm-subj { font-weight: 700; font-size: 1.02rem; }
.hm-body { margin: .7rem 0; color: var(--ink-2); }
.hm-att { display: inline-block; background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: .3em .7em; font-family: var(--mono); font-size: .82rem; }
.hm-f { border-radius: 3px; transition: background .3s, box-shadow .3s; }

.hm-notes { margin: 1rem 0 0; padding: .8rem 0 0 1.2rem; border-top: 1px dashed var(--line-2); font-size: .85rem; color: var(--seal); display: grid; gap: .15rem; }
.hm-notes li { opacity: 0; transform: translateX(-6px); transition: opacity .35s, transform .35s; }
.hm-notes li.on { opacity: 1; transform: none; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }

.tl-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: .6rem; }
.tl-h { margin-bottom: .1rem; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(6, auto); gap: .45rem 1rem; }
.timeline li > a, .timeline li > div { display: grid; grid-template-columns: 7.4rem 1fr; gap: .8rem; padding: .7rem .9rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); text-decoration: none; color: var(--ink); height: 100%; font-size: .92rem; line-height: 1.35; }
.timeline li > a:hover { border-color: var(--ink-2); }
.tl-time { font-variant-numeric: tabular-nums; color: var(--ink-3); }
.tl-sang > a { border-left: 4px solid var(--warn); } .tl-chieu > a { border-left: 4px solid var(--navy); }
.tl-break > div { background: transparent; border-style: dashed; color: var(--ink-3); }
@media (max-width: 760px) { .tl-wrap { display: none; } .timeline { grid-template-columns: 1fr; grid-auto-flow: row; grid-template-rows: none; } }

.obj-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }

.basis { padding-left: 1.2rem; }

/* Tự kiểm tra thiết bị */
.devcheck { display: grid; grid-template-columns: 200px 1fr; gap: 1.4rem; align-items: start; }

.devcheck-ring { text-align: center; }
.ring { width: 160px; height: 160px; }
.ring-bg { fill: none; stroke: var(--sunk); stroke-width: 14; }
.ring-fg { fill: none; stroke: var(--seal); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1), stroke .3s; }
.ring-fg.warn { stroke: var(--warn); } .ring-fg.ok { stroke: var(--safe); }
.ring-t { text-anchor: middle; font-size: 24px; font-weight: 800; fill: var(--ink); }
.ring-msg { font-size: .9rem; color: var(--ink-2); }

/* Chuỗi tấn công */
.chain { list-style: none; margin: 0 0 1rem; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: .4rem; }
@media (max-width: 760px) { .chain { grid-template-columns: 1fr 1fr; } }
.chain li { position: relative; }
.chain-node { width: 100%; height: 100%; display: flex; flex-direction: column; gap: .3rem; padding: .7rem; text-align: left; border: 1.5px solid var(--line-2); border-radius: var(--r-md); background: var(--surface); font-weight: 600; font-size: .9rem; transition: all .3s; }
.chain-n { font-size: .78rem; color: var(--ink-3); }
.chain-node.past { border-color: var(--seal); color: var(--seal); }
.chain-node.active { background: var(--seal); border-color: var(--seal); color: #fff; }
.chain-node.active .chain-n { color: #F6C9D0; }
.chain-node.cut { background: var(--sunk); border-color: var(--line); color: var(--ink-3); text-decoration: line-through; }
.chain-node.active.cut { background: var(--safe); border-color: var(--safe); color: #fff; text-decoration: none; }
.chain-pane { padding: 1rem 1.2rem; background: var(--sunk); border-radius: var(--r-md); min-height: 8rem; }
.chain-cut { padding: .7rem .9rem; background: var(--safe-soft); border-radius: var(--r-sm); color: #064B3D; margin: 0; }

/* Hộp thư mô phỏng */
.ib { display: grid; grid-template-columns: 290px 1fr; gap: 1rem; }
@media (max-width: 860px) { .ib { grid-template-columns: 1fr; } .ib-list { max-height: 220px; } }
.ib-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .3rem; max-height: 620px; overflow-y: auto; }
.ib-item { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: .1rem .5rem; text-align: left; padding: .6rem .7rem; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface); font-size: .84rem; }
.ib-item.active { border-color: var(--navy); background: var(--navy-soft); }
.ib-ch { grid-column: 1; font-size: .72rem; font-weight: 700; color: var(--ink-3); }
.ib-from { grid-column: 1; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ib-sub { grid-column: 1; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ib-res { grid-column: 2; grid-row: 1 / span 3; align-self: center; font-weight: 800; font-size: .78rem; }
.ib-item.right .ib-res { color: var(--safe); } .ib-item.wrong .ib-res { color: var(--seal); }
.ib-score { font-size: .9rem; font-weight: 600; margin-top: .6rem; }
.ib-count { font-size: .82rem; color: var(--ink-3); margin-bottom: .4rem; }
.msg-stage { position: relative; }
.msg { border: 1px solid var(--line-2); border-radius: var(--r-md); background: #fff; overflow: hidden; }
.msg-head { padding: .8rem 1rem; border-bottom: 1px solid var(--line); background: var(--sunk); }
.msg-subj { font-weight: 700; font-size: 1.06rem; margin-bottom: .25rem; }
.msg-meta { font-size: .86rem; color: var(--ink-2); word-break: break-word; }
.msg-body { padding: 1rem; font-size: .96rem; }
.msg-body p:last-child { margin: 0; }
.msg-att { margin: 0 1rem 1rem; display: inline-block; padding: .35em .7em; border: 1px solid var(--line); border-radius: 6px; font-family: var(--mono); font-size: .84rem; background: var(--sunk); }
.msg-sms .bubble, .msg-zalo .bubble { margin: 1rem; padding: .8rem 1rem; border-radius: 16px 16px 16px 4px; max-width: 88%; font-size: .95rem; }
.msg-sms .bubble { background: #EDEFF3; }
.msg-zalo .bubble { background: #E5F0FF; }
.bubble p:last-child { margin: 0; }
.call-body { font-style: italic; }
.msg-context { margin: 0 1rem 1rem; font-size: .86rem; color: var(--navy); background: var(--navy-soft); padding: .5rem .7rem; border-radius: 6px; }
.msg a[data-href] { color: #1A56DB; text-decoration: underline; cursor: pointer; }
.msg mark { background: none; color: inherit; }
.msg.revealed mark { background: var(--seal-soft); box-shadow: 0 0 0 2px var(--seal); border-radius: 3px; counter-increment: flag; }
.msg.revealed { counter-reset: flag; }
.msg.revealed mark::after { content: counter(flag); display: inline-grid; place-items: center; width: 1.2rem; height: 1.2rem; margin-left: .25rem; border-radius: 50%; background: var(--seal); color: #fff; font-size: .7rem; font-weight: 800; font-style: normal; vertical-align: 2px; }
.ib-acts { display: flex; gap: .6rem; margin: 1rem 0; }
.ib-acts .btn { flex: 1; min-height: 50px; font-size: 1.02rem; }
.ib-fb { margin-top: 1rem; padding: 1rem 1.1rem; border-radius: var(--r-md); }
.ib-fb.ok { background: var(--safe-soft); } .ib-fb.bad { background: var(--seal-soft); }
.ib-flags { padding-left: 1.3rem; display: grid; gap: .3rem; font-size: .93rem; }
.ib-status { margin-top: .6rem; font-size: .86rem; font-family: var(--mono); padding: .45rem .7rem; background: var(--ink); color: #D6DEEB; border-radius: 6px; word-break: break-all; }
.ib-status.warn { background: var(--warn); color: #fff; }

/* Đường liên kết */
.url-drill { position: relative; padding: 1rem 1.2rem; background: var(--sunk); border-radius: var(--r-md); }
.url-big { font-family: var(--mono); font-size: clamp(.95rem, 2.3vw, 1.2rem); font-weight: 600; word-break: break-all; padding: .7rem .9rem; background: #fff; border: 1px solid var(--line); border-radius: var(--r-sm); }
.url-fb .ok, .url-fb .bad { font-size: 1rem; }

.ua { display: inline-flex; flex-direction: column; align-items: center; animation: fade-in .35s both; }
.ua:nth-child(2) { animation-delay: .1s; } .ua:nth-child(3) { animation-delay: .2s; } .ua:nth-child(4) { animation-delay: .3s; } .ua:nth-child(5) { animation-delay: .4s; }
.ua-t { padding: .3em .45em; border-radius: 4px; background: #fff; border: 1px solid var(--line); word-break: break-all; }

.ua-sub .ua-t { color: var(--ink-3); }
.ua-reg .ua-t { background: var(--seal); color: #fff; font-weight: 700; border-color: var(--seal); }
.ua-reg.ok .ua-t { background: var(--safe); border-color: var(--safe); }
.ua-reg .ua-l { color: var(--ink); font-weight: 700; }
.ua-path .ua-t { color: var(--ink-2); }
.url-flags { padding-left: 1.2rem; font-size: .93rem; display: grid; gap: .25rem; }
.url-input { width: 100%; padding: .7em .9em; font-family: var(--mono); border: 2px solid var(--line-2); border-radius: var(--r-sm); font-size: 1rem; }

/* Trí tuệ nhân tạo */
.ai { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
@media (max-width: 760px) { .ai { grid-template-columns: 1fr; } }
.ai-ta { width: 100%; padding: .8em; border: 2px solid var(--line-2); border-radius: var(--r-md); resize: vertical; font-size: .95rem; min-height: 150px; }
.ai-cap { font-size: .8rem; font-weight: 700; color: var(--ink-3); margin-bottom: .3rem; }
.ai-view { min-height: 150px; padding: .8em; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--sunk); font-size: .95rem; white-space: pre-wrap; word-break: break-word; }
.ai-view mark { border-radius: 3px; padding: 0 2px; }
.ai-view mark.lv3 { background: var(--seal); color: #fff; }
.ai-view mark.lv2 { background: #FFD58A; color: #3E2600; }
.ai-view mark.lv1 { background: var(--navy-soft); color: var(--navy); box-shadow: inset 0 -2px 0 var(--navy); }
.ai-found { list-style: none; padding: 0; margin: .6rem 0 0; display: flex; flex-wrap: wrap; gap: .35rem; }
.ai-found li { font-size: .8rem; font-weight: 700; padding: .2em .6em; border-radius: 99px; }
.ai-found .lv3 { background: var(--seal); color: #fff; } .ai-found .lv2 { background: #FFD58A; color: #3E2600; } .ai-found .lv1 { background: var(--navy-soft); color: var(--navy); }
.ai-verdict { margin-top: 1rem; border-radius: var(--r-sm); font-weight: 600; }
.ai-verdict.bad, .ai-verdict.warn, .ai-verdict.ok { padding: .8rem 1rem; }
.ai-verdict.bad { background: var(--seal-soft); color: #7E0E1E; } .ai-verdict.warn { background: var(--warn-soft); color: #5E3800; } .ai-verdict.ok { background: var(--safe-soft); color: #064B3D; }

/* Kiểm chứng */
.ver { display: grid; grid-template-columns: 1.2fr 1fr; gap: 1rem; }
@media (max-width: 760px) { .ver { grid-template-columns: 1fr; } }
.ver-chat { display: grid; gap: .7rem; }
.ver-who { display: block; font-size: .76rem; font-weight: 700; color: var(--ink-3); margin-bottom: .3rem; }
.ver-q { padding: .8rem 1rem; background: var(--navy); color: #fff; border-radius: 14px 14px 4px 14px; margin-left: 12%; }
.ver-q .ver-who { color: #B6C1D5; }
.ver-a { padding: .8rem 1rem; background: var(--sunk); border-radius: 14px 14px 14px 4px; min-height: 5rem; }
.claim { display: inline; background: none; border: 0; padding: 0 2px; text-align: left; line-height: 1.7; border-bottom: 2px dotted var(--ink-3); border-radius: 0; font-size: .96rem; }
.claim:hover { background: #fff; }
.claim.checked.ok { background: var(--safe-soft); border-bottom: 2px solid var(--safe); }
.claim.checked.bad { background: var(--seal-soft); border-bottom: 2px solid var(--seal); text-decoration: line-through; text-decoration-color: var(--seal); }
.claim.checked.warn { background: var(--warn-soft); border-bottom: 2px solid var(--warn); }
.ver-res { padding: 1rem; border: 1px solid var(--line); border-radius: var(--r-md); }
.ver-tag { font-weight: 800; }
.ver-tag.ok { color: var(--safe); } .ver-tag.bad { color: var(--seal); } .ver-tag.warn { color: var(--warn); }
.ver-sum { margin-top: .8rem; padding-top: .8rem; border-top: 1px solid var(--line); font-weight: 600; }

/* Sao lưu */
.bk { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8rem; }
@media (max-width: 640px) { .bk { grid-template-columns: 1fr; } }
.bk-box { position: relative; display: flex; flex-direction: column; gap: .25rem; padding: 1rem; border: 2px solid var(--line-2); border-radius: var(--r-md); background: var(--surface); transition: all .4s; }
.bk-ico { width: 38px; height: 44px; border-radius: 4px 12px 4px 4px; background: var(--navy-soft); border: 2px solid var(--navy); margin-bottom: .3rem; transition: all .4s; }
.bk-box span { font-size: .88rem; color: var(--ink-2); }
.bk-state { font-weight: 700; color: var(--ink) !important; margin-top: .3rem; }
.bk-box.hit { border-color: var(--seal); background: var(--seal-soft); animation: shake .45s; }
.bk-box.hit .bk-ico { background: var(--seal); border-color: var(--seal); }
.bk-box.hit .bk-state { color: var(--seal) !important; }
.bk-box.safe { border-color: var(--safe); background: var(--safe-soft); }
.bk-box.safe .bk-ico { background: var(--safe); border-color: var(--safe); }
.bk-box.safe .bk-state { color: var(--safe) !important; }
.bk-note { margin-top: .8rem; font-weight: 600; }

/* Diễn tập */
.drill { position: relative; }
.drill-menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .7rem; }
.drill-pick { display: grid; gap: .3rem; text-align: left; padding: 1.1rem; border: 1.5px solid var(--line-2); border-radius: var(--r-md); background: var(--surface); }
.drill-pick:hover { border-color: var(--seal); background: var(--seal-soft); }
.drill-pick strong { color: var(--seal); font-size: .85rem; }
.drill-clock { position: relative; height: 30px; background: var(--sunk); border-radius: 6px; overflow: hidden; margin-bottom: .8rem; }
.drill-clock-bar { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--navy-soft); transition: width 1s linear; }
.drill-clock span { position: relative; display: block; padding: .25rem .7rem; font-weight: 700; font-size: .88rem; font-variant-numeric: tabular-nums; }
.drill-clock.low .drill-clock-bar { background: var(--seal-soft); }
.drill-clock.low span { color: var(--seal); }
.drill-end { position: relative; padding: 1rem 0; }

body.projector .wg-intro, body.projector .pt dd { font-size: 1.05rem; }

/* ===== Biểu tượng và thẻ minh họa ===== */
.ico { display: inline-grid; place-items: center; flex-shrink: 0; }
.ico svg { width: 100%; height: 100%; }
.icards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: .8rem; }
.icards.four { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 900px) { .icards.four { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .icards.four { grid-template-columns: 1fr; } }
.icard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 1rem 1.05rem; }
.icard .ico { width: 44px; height: 44px; padding: 9px; border-radius: 12px; background: var(--navy-soft); color: var(--navy); margin-bottom: .6rem; }
.icard:nth-child(4n+2) .ico { background: var(--warn-soft); color: var(--warn); }
.icard:nth-child(4n+3) .ico { background: var(--safe-soft); color: var(--safe); }

.icard h3 { font-size: 1rem; margin-bottom: .3rem; }
.icard p { font-size: .9rem; color: var(--ink-2); margin: 0; }
.flow-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
.flow-ico { width: 30px; height: 30px; color: var(--ink-3); }
.flow-node.active .flow-ico { color: #fff; } .flow-node.past .flow-ico { color: var(--safe); }

/* Tủ hồ sơ bốn cấp độ */
.cab-wrap { display: grid; grid-template-columns: minmax(240px, 320px) 1fr; gap: 1.4rem; align-items: start; }
@media (max-width: 760px) { .cab-wrap { grid-template-columns: 1fr; } }
.cab-col { display: grid; grid-template-columns: 1fr 26px; gap: .5rem; }
.cab { display: grid; gap: 6px; padding: 10px; background: #8C97A8; border-radius: 10px; box-shadow: inset 0 0 0 3px #6F7B90; }
.drawer { position: relative; display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: .7rem; align-items: center; text-align: left; padding: .8rem .9rem; border: 0; border-radius: 6px; background: #E9EDF3; box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); transition: transform .3s cubic-bezier(.2,.8,.2,1), background .2s; }
.drawer-handle { grid-row: 1 / span 2; width: 30px; height: 8px; border-radius: 4px; background: #9AA6B8; }
.drawer-n { font-size: .74rem; font-weight: 700; color: var(--ink-3); }
.drawer-t { grid-column: 2; font-weight: 800; }
.drawer-lock { grid-column: 3; grid-row: 1 / span 2; } .drawer-lock .ico { width: 26px; height: 26px; }
.drawer.lv0 { border-left: 6px solid var(--l0); } .drawer.lv1 { border-left: 6px solid var(--l1); } .drawer.lv2 { border-left: 6px solid var(--l2); } .drawer.lv3 { border-left: 6px solid var(--l3); }
.drawer.lv0 .drawer-lock { color: var(--l0); } .drawer.lv1 .drawer-lock { color: var(--l1); } .drawer.lv2 .drawer-lock { color: var(--l2); } .drawer.lv3 .drawer-lock { color: var(--l3); }
.drawer.open { transform: translateX(14px); background: #fff; }
.cab-scale { position: relative; border-radius: 6px; background: linear-gradient(var(--l0), var(--l1), var(--l2), var(--l3)); }
.cab-scale span { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(90deg); white-space: nowrap; font-size: .72rem; font-weight: 700; color: #fff; }
.cab-detail { display: grid; gap: 1rem; animation: fade-in .35s; }
.cab-paper { position: relative; background: #fff; border: 1px solid var(--line-2); border-radius: 4px; padding: 1.1rem 1.2rem 1rem; box-shadow: 6px 6px 0 var(--sunk); }
.cab-paper ul { margin: 0; padding-left: 1.2rem; display: grid; gap: .25rem; }
.cab-stamp { position: absolute; right: 12px; top: 10px; padding: .1em .5em; border: 3px double currentColor; border-radius: 6px; font-weight: 800; font-size: .95rem; transform: rotate(-8deg); animation: stamp-in .45s both; }
.cab-detail.lv0 .cab-stamp { color: var(--l0); } .cab-detail.lv1 .cab-stamp { color: var(--l1); } .cab-detail.lv2 .cab-stamp { color: var(--l2); } .cab-detail.lv3 .cab-stamp { color: var(--l3); }
.cab-dl { margin: 0; display: grid; gap: .6rem; }
.cab-dl div { display: grid; grid-template-columns: 11rem 1fr; gap: .8rem; }
@media (max-width: 520px) { .cab-dl div { grid-template-columns: 1fr; gap: .1rem; } }
.cab-dl dt { display: flex; align-items: center; gap: .45rem; font-weight: 700; font-size: .9rem; }
.cab-dl dt .ico { width: 20px; height: 20px; color: var(--ink-3); }
.cab-dl dd { margin: 0; color: var(--ink-2); }

/* Kịch bản lừa đảo */
.scams { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: .9rem; }
.sc-card { position: relative; display: flex; flex-direction: column; gap: .6rem; padding: .9rem; text-align: left; border: 1.5px solid var(--line); border-radius: var(--r-md); background: var(--surface); min-height: 250px; }
.sc-card:hover { border-color: var(--seal); }
.sc-title { font-weight: 800; }
.sc-screen { border-radius: 14px; padding: .7rem; background: #EEF2F8; border: 6px solid #223049; font-size: .85rem; flex: 1; transition: filter .3s, opacity .3s; }
.sc-head, .sc-call { display: flex; align-items: center; gap: .45rem; margin-bottom: .5rem; font-size: .8rem; flex-wrap: wrap; }
.sc-head .ico, .sc-call .ico { width: 22px; height: 22px; color: var(--navy); }
.sc-tag { margin-left: auto; font-size: .7rem; font-weight: 700; color: var(--seal); background: var(--seal-soft); padding: .1em .45em; border-radius: 4px; }
.sc-call { flex-direction: column; align-items: center; text-align: center; }
.sc-call .ico { width: 34px; height: 34px; padding: 6px; border-radius: 50%; background: var(--safe); color: #fff; animation: ring 1s ease-in-out infinite; }
@keyframes ring { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }
.sc-call span { color: var(--ink-3); }
.sc-msg { margin: 0; }
.sc-bubble { background: #fff; padding: .5rem .65rem; border-radius: 12px 12px 12px 3px; }
.sc-email .sc-bubble { border-radius: 4px; }
.sc-quote { font-style: italic; }
.sc-qr { position: relative; height: 90px; margin-bottom: .5rem; }
.sc-qr .ico { position: absolute; width: 80px; height: 80px; background: #fff; padding: 6px; }
.qr-old { left: 18%; top: 4px; color: #15233B; } .qr-new { left: 30%; top: 12px; color: var(--seal); transform: rotate(8deg); border: 2px dashed var(--seal); }
.sc-back { display: none; font-size: .88rem; }
.sc-back ul { margin: 0 0 .4rem; padding-left: 1.1rem; }
.sc-back p { margin: 0; }
.sc-h { font-weight: 800; font-size: .78rem; color: var(--seal); margin: 0 0 .2rem !important; }
.sc-h.ok { color: var(--safe); margin-top: .3rem !important; }
.sc-card.open { border-color: var(--seal); background: var(--seal-soft); }
.sc-card.open .sc-screen { display: none; }

/* Hành trình dữ liệu AI */
.aif-doc { display: inline-flex; align-items: center; gap: .4rem; padding: .35em .7em; border: 1.5px solid var(--seal); border-radius: 6px; font-size: .88rem; font-weight: 600; color: var(--seal); background: var(--seal-soft); }
.aif-doc .ico { width: 18px; height: 18px; }
.aif-doc.fly { animation: fly 2.3s ease-in forwards; }
@keyframes fly { 0% { transform: none; opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(60vw, 30px) scale(.5); opacity: 0; } }
.aif-row { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.2rem; position: relative; }

@media (max-width: 700px) { .aif-row, .aif-outs { grid-template-columns: 1fr; gap: .8rem; } .aif-node::after { display: none; } }

/* OTP */

.otp-feed { height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: .5rem; }

/* Bản đồ kênh */

.chm-arrow { background: linear-gradient(90deg, transparent 45%, var(--line-2) 45%, var(--line-2) 55%, transparent 55%); position: relative; }

/* ===== Bài kiểm tra thực hành ===== */

.ft-count { font-weight: 700; margin-top: .6rem; }
.desk-ring.missed { stroke: var(--warn); stroke-dasharray: 8 6; fill: rgba(154,91,0,.1); }

.ft-score { font-size: 1.2rem; margin-bottom: .5rem; }

/* spot */

.fm-phone { max-width: 380px; border: 10px solid #15233B; border-radius: 28px; background: #EEF2F8; padding: 1rem .8rem; display: flex; flex-direction: column; gap: .5rem; }

.fm-time { align-self: flex-end; font-size: .78rem; color: var(--ink-3); }

.sp:hover { background: var(--navy-soft); }

.sp.r-ok { background: var(--safe-soft); box-shadow: 0 0 0 2px var(--safe); }

.sp.r-wrong { text-decoration: line-through; text-decoration-color: var(--seal); background: var(--sunk); box-shadow: none; }

/* domain */
.ft-url-row { display: grid; grid-template-columns: 2rem 1fr; gap: .7rem; align-items: start; padding: .7rem 0; border-top: 1px solid var(--line); }
.ft-url-n { display: grid; place-items: center; width: 1.8rem; height: 1.8rem; border-radius: 50%; background: var(--ink); color: #fff; font-weight: 800; font-size: .85rem; }

.ft-seg { font-family: var(--mono); font-size: clamp(.85rem, 2vw, 1.02rem); padding: .4em .5em; border: 1.5px solid var(--line-2); background: #fff; border-radius: 5px; }
.ft-seg:hover { border-color: var(--navy); }
.ft-seg.picked { background: var(--navy); color: #fff; border-color: var(--navy); }
.ft-seg.r-ok { background: var(--safe); color: #fff; border-color: var(--safe); }
.ft-seg.r-wrong { background: var(--seal-soft); color: var(--seal); border-color: var(--seal); text-decoration: line-through; }
.ft-url-v { margin: .5rem 0 0; font-size: .9rem; color: var(--ink-2); }

/* tiles */
.ft-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: .7rem; }
.ft-tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: .45rem; padding: 1rem .6rem .8rem; border: 2px solid var(--line); border-radius: var(--r-md); background: var(--surface); text-align: center; }
.ft-file { position: relative; width: 52px; height: 64px; background: #fff; border: 2px solid var(--ink-3); border-radius: 4px 14px 4px 4px; display: grid; place-items: end center; padding-bottom: 6px; }
.ft-ext { font-size: .62rem; font-weight: 800; background: var(--ink-3); color: #fff; padding: .05em .3em; border-radius: 3px; }
.ft-name { font-family: var(--mono); font-size: .8rem; word-break: break-all; }
.ft-flag { display: none; font-size: .72rem; font-weight: 800; color: #fff; background: var(--seal); padding: .1em .5em; border-radius: 4px; }
.ft-tile.picked { border-color: var(--seal); background: var(--seal-soft); }
.ft-tile.picked .ft-flag { display: inline-block; }
.ft-tile.picked .ft-file { border-color: var(--seal); } .ft-tile.picked .ft-ext { background: var(--seal); }
.ft-tile.r-ok { box-shadow: 0 0 0 3px var(--safe); }
.ft-tile.r-wrong { box-shadow: 0 0 0 3px var(--warn); }
.ft-tip { font-size: .78rem; color: var(--ink-2); }

/* assign */
.ft-docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: .9rem; }
.ft-doc { border-radius: var(--r-md); padding: .6rem; background: var(--sunk); }
.ft-paper { position: relative; display: flex; gap: .6rem; align-items: flex-start; min-height: 96px; padding: .9rem .9rem 1.8rem; background: #fff; border: 1px solid var(--line-2); border-radius: 4px; font-weight: 600; font-size: .94rem; }
.ft-paper .ico { width: 28px; height: 28px; color: var(--ink-3); }
.ft-dstamp { position: absolute; right: 10px; bottom: 6px; font-weight: 800; font-size: .82rem; padding: .05em .45em; border: 3px double currentColor; border-radius: 5px; transform: rotate(-8deg); opacity: 0; }
.ft-dstamp.on { opacity: 1; animation: stamp-in .4s both; }
.ft-dstamp.lv0, .ft-db.lv0 { color: var(--l0); } .ft-dstamp.lv1, .ft-db.lv1 { color: var(--l1); } .ft-dstamp.lv2, .ft-db.lv2 { color: var(--l2); } .ft-dstamp.lv3, .ft-db.lv3 { color: var(--l3); }
.ft-dbtns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: .5rem; }
.ft-db { font-size: .72rem; font-weight: 700; padding: .45em .2em; border: 1.5px solid currentColor; border-radius: 5px; background: #fff; line-height: 1.2; min-height: 40px; }
.ft-db.picked.lv0 { background: var(--l0); color: #fff; } .ft-db.picked.lv1 { background: var(--l1); color: #fff; } .ft-db.picked.lv2 { background: var(--l2); color: #fff; } .ft-db.picked.lv3 { background: var(--l3); color: #fff; }
.ft-doc.r-ok { box-shadow: 0 0 0 3px var(--safe); } .ft-doc.r-wrong { box-shadow: 0 0 0 3px var(--seal); }
.ft-fix { margin: .4rem 0 0; font-size: .85rem; font-weight: 700; color: var(--seal); }

/* order */
.ft-pool { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
.ft-chip { display: inline-flex; align-items: center; gap: .45rem; padding: .6em .9em; border: 1.5px solid var(--line-2); border-radius: 8px; background: #fff; font-weight: 600; }
.ft-chip .ico { width: 22px; height: 22px; color: var(--navy); }
.ft-chip.mono { font-family: var(--mono); }
.ft-chip:disabled { opacity: .3; cursor: default; }
.ft-slots { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; }
.ft-slot { display: grid; grid-template-columns: 2.2rem 1fr auto; gap: .7rem; align-items: center; padding: .55rem .8rem; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; min-height: 50px; animation: fade-in .25s; }
.ft-slot.empty { border-style: dashed; background: var(--sunk); }
.ft-slot-n { display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%; background: var(--navy-soft); color: var(--navy); font-weight: 800; }
.ft-slot.r-ok { border-color: var(--safe); background: var(--safe-soft); } .ft-slot.r-wrong { border-color: var(--seal); background: var(--seal-soft); }

/* dialog */
.ft-dialog { display: grid; grid-template-columns: 320px 1fr; gap: 1.2rem; align-items: start; }
@media (max-width: 720px) { .ft-dialog { grid-template-columns: 1fr; } }
.ft-call { border: 10px solid #15233B; border-radius: 28px; background: #EEF2F8; overflow: hidden; }
.ft-call-h { display: flex; align-items: center; gap: .5rem; padding: .7rem .9rem; background: var(--safe); color: #fff; font-weight: 700; font-size: .88rem; }
.ft-call-h .ico { width: 22px; height: 22px; animation: ring 1s ease-in-out infinite; }
.ft-feed { height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: .5rem; padding: .8rem; }
.ft-opts { display: grid; gap: .5rem; }

.wg-illus > h2::before { content: "Minh họa"; color: var(--navy); }

/* ===== Phần mở đầu pháp luật và an toàn AI ===== */

.law-guide .law-top .ico { background: var(--warn-soft); color: var(--warn); }
.ft-rail { grid-template-columns: repeat(11, 1fr); }

/* Dòng thời gian */
.tl2-wrap { overflow-x: auto; padding: 4px 2px 10px; }

.tl2::before { content: ""; position: absolute; left: 0; right: 0; top: 29px; height: 3px; background: var(--line-2); }
.tl2-dot { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; gap: .3rem; padding: 0 .2rem .3rem; background: none; border: 0; text-align: center; }
.tl2-dot .ico { width: 44px; height: 44px; padding: 10px; border-radius: 50%; background: #fff; border: 3px solid var(--line-2); color: var(--ink-3); transition: all .25s; position: relative; z-index: 1; }
.tl2-d { font-size: .78rem; font-weight: 800; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tl2-t { font-size: .74rem; line-height: 1.3; color: var(--ink-3); }
.tl2-dot.k-law .ico { border-color: var(--navy); color: var(--navy); } .tl2-dot.k-party .ico { border-color: var(--seal); color: var(--seal); }
.tl2-dot.k-decree .ico { border-color: var(--safe); color: var(--safe); } .tl2-dot.k-guide .ico { border-color: var(--warn); color: var(--warn); }
.tl2-dot.active .ico { transform: scale(1.14); color: #fff; }
.tl2-dot.active.k-law .ico { background: var(--navy); } .tl2-dot.active.k-party .ico { background: var(--seal); } .tl2-dot.active.k-decree .ico { background: var(--safe); } .tl2-dot.active.k-guide .ico { background: var(--warn); }
.tl2-dot.active .tl2-t { color: var(--ink); font-weight: 700; }
.tl2-card { margin-top: .6rem; padding: 1.1rem 1.2rem; border-radius: var(--r-md); border: 1px solid var(--line); border-left: 6px solid var(--navy); background: var(--sunk); animation: fade-in .35s; }
.tl2-card.k-party { border-left-color: var(--seal); } .tl2-card.k-decree { border-left-color: var(--safe); } .tl2-card.k-guide { border-left-color: var(--warn); }
.tl2-head { display: flex; gap: .8rem; align-items: flex-start; margin-bottom: .6rem; }
.tl2-head .ico { width: 40px; height: 40px; padding: 8px; border-radius: 10px; background: #fff; color: var(--navy); border: 1px solid var(--line); }
.tl2-head h4 { margin: 0 0 .15rem; }
.tl2-kind { margin: 0; font-size: .78rem; font-weight: 700; color: var(--ink-3); }
.tl2-sub { margin: 0; font-size: .9rem; color: var(--ink-2); }
.tl2-points { margin: 0; padding-left: 1.2rem; display: grid; gap: .35rem; }

/* Đúng hay sai */
.tf { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: .8rem; }
.tf-card { position: relative; display: flex; flex-direction: column; gap: .6rem; padding: 1rem; border: 1.5px solid var(--line); border-radius: var(--r-md); background: var(--surface); overflow: hidden; }
.tf-card .stamp { font-size: 1.1rem; top: 8px; right: 8px; }
.tf-n { display: grid; place-items: center; width: 1.8rem; height: 1.8rem; border-radius: 50%; background: var(--ink); color: #fff; font-weight: 800; font-size: .85rem; }
.tf-s { margin: 0; font-weight: 600; flex: 1; padding-right: 2.5rem; }
.tf-btns { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; }
.tf-res { font-size: .9rem; }
.tf-card.ok { border-color: var(--safe); background: var(--safe-soft); } .tf-card.bad { border-color: var(--seal); background: var(--seal-soft); }
.tf-score { font-weight: 700; margin-top: .8rem; }

/* AI đoán chữ */
.nw { display: grid; gap: .7rem; }
.nw-prompt, .nw-out { padding: .8rem 1rem; border-radius: 12px; }
.nw-prompt { background: var(--navy); color: #fff; margin-left: 10%; }
.nw-out { background: var(--sunk); border: 1px solid var(--line); }

.nw-line { margin: 0; font-size: 1.08rem; }
.nw-blank { color: var(--ink-3); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.nw-word { background: #FFE7A3; box-shadow: 0 0 0 2px var(--warn); border-radius: 3px; padding: 0 2px; font-weight: 700; }
.nw-cap { margin: 0; font-size: .85rem; color: var(--ink-3); }
.nw-bars { display: grid; gap: .35rem; }
.nw-row { display: grid; grid-template-columns: 9.5rem 1fr 3rem; gap: .6rem; align-items: center; font-size: .88rem; padding: .2rem .4rem; border-radius: 6px; transition: background .3s; }
.nw-w { font-family: var(--mono); font-size: .82rem; }
.nw-track { height: 12px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.nw-fill { display: block; height: 100%; width: 0; background: var(--ink-3); border-radius: 99px; transition: width 1s cubic-bezier(.2,.8,.2,1); }
.nw-p { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.nw-row.pick { background: var(--warn-soft); } .nw-row.pick .nw-fill { background: var(--warn); } .nw-row.pick .nw-w { font-weight: 800; }

.hook h2 { color: #9A6B00; }
.wg > h2::before { color: var(--brand); }
.wg-illus > h2::before { content: "Minh họa tương tác"; color: var(--k1); }
.wg { box-shadow: 0 10px 30px -24px rgba(11,99,206,.45); }
.seg button[aria-pressed="true"] { background: var(--brand); color: #fff; }
.tab[aria-selected="true"] { border-color: var(--brand); color: var(--brand); }
.part-h { position: relative; overflow: hidden; display: flex; align-items: center; gap: .6rem; font-size: 1.1rem; color: #fff; background: linear-gradient(100deg, #0A3F8F, #0B63CE 65%, #19B5E8); margin: 3rem 0 1.3rem; padding: .85rem 1.1rem; border-radius: 14px; box-shadow: 0 10px 24px -18px rgba(11,63,143,.9); }
.part-h::after { content: ""; position: absolute; right: -20px; top: -40px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.12); }
.flip-ico { width: 36px; height: 36px; padding: 7px; border-radius: 10px; background: var(--navy-soft); color: var(--brand); margin: .2rem 0 .4rem; }
.icard { transition: transform .2s, box-shadow .2s; }
.icard:hover { transform: translateY(-3px); box-shadow: 0 12px 24px -18px rgba(11,99,206,.6); }

/* Kích thước mặc định của biểu tượng; các thành phần cụ thể ghi đè bên dưới */
.ico { width: 1.25em; height: 1.25em; vertical-align: -.22em; }
.sub-h { display: flex; align-items: center; gap: .4rem; }
.sub-h .ico { width: 22px; height: 22px; color: var(--brand); }

/* Mục lục nhỏ trong chuyên đề */
.mini-toc { display: flex; flex-wrap: wrap; gap: .45rem; margin: -0.6rem 0 2rem; }
.mini-toc a { display: inline-flex; align-items: center; gap: .4rem; padding: .35rem .75rem .35rem .4rem; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink-2); font-size: .85rem; font-weight: 600; }
.mini-toc a b { display: inline-grid; place-items: center; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--brand); color: #fff; font-size: .75rem; }
.mini-toc a:hover { border-color: var(--brand); color: var(--brand); }

/* Pháo giấy */
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
.confetti i { position: absolute; top: -10px; width: 8px; height: 12px; border-radius: 2px; animation: conf 1.5s cubic-bezier(.2,.6,.4,1) forwards; }
@keyframes conf { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(var(--dx), 340px) rotate(var(--r)); opacity: 0; } }

/* Thẻ câu lệnh 6 thành phần */
.prompt-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 1.2rem 1.3rem; }
.prompt-card > h2 { font-size: 1.05rem; }
.pc-rows { display: grid; gap: .4rem; }
.pc-row { display: grid; grid-template-columns: 11rem 1fr; gap: .8rem; align-items: start; padding: .55rem .7rem; border-radius: 10px; background: color-mix(in srgb, var(--kc) 7%, #fff); border-left: 4px solid var(--kc); }
.pc-k { display: flex; align-items: center; gap: .45rem; font-weight: 700; color: var(--kc); font-size: .9rem; }
.pc-k b { display: inline-grid; place-items: center; min-width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--kc); color: #fff; font-size: .75rem; }
.pc-v { font-size: .94rem; }
@media (max-width: 640px) { .pc-row { grid-template-columns: 1fr; gap: .2rem; } }

/* ---------- Thực hành nhóm ---------- */
.gt-gen { margin-bottom: 1rem; border: 1px dashed var(--line-2); border-radius: var(--r-md); padding: .6rem .9rem; }
.gt-gen summary { cursor: pointer; font-weight: 600; color: var(--brand); }
.gt-gen .pc-rows { margin: .7rem 0; }
.gt-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; margin-bottom: 1rem; }
.gt-tab { display: flex; align-items: center; gap: .5rem; padding: .65rem .8rem; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; font-size: .9rem; text-align: left; line-height: 1.25; transition: all .2s; }
.gt-tab .ico { width: 30px; height: 30px; padding: 5px; border-radius: 8px; background: color-mix(in srgb, var(--gc) 14%, #fff); color: var(--gc); flex-shrink: 0; }
.gt-tab[aria-selected="true"] { border-color: var(--gc); background: color-mix(in srgb, var(--gc) 9%, #fff); color: var(--gc); box-shadow: 0 6px 16px -10px var(--gc); }
.gt-pane { animation: fadeUp .35s ease both; }
.gt-sit { background: color-mix(in srgb, var(--gc) 8%, #fff); border: 1px solid color-mix(in srgb, var(--gc) 30%, #fff); border-radius: 12px; padding: .9rem 1rem; }
.gt-sit p { margin: 0; }
.gt-k { display: flex; align-items: center; gap: .4rem; font-weight: 700; color: var(--gc); margin-bottom: .35rem !important; font-size: .9rem; }
.gt-k .ico { width: 18px; height: 18px; }
.gt-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 1.2rem; align-items: start; }
.gt-ed { display: grid; gap: .45rem; }
.gt-row { display: grid; gap: .25rem; padding: .45rem .55rem; border-radius: 10px; border-left: 4px solid var(--kc); background: color-mix(in srgb, var(--kc) 6%, #fff); }
.gt-lab { display: flex; align-items: center; gap: .4rem; font-weight: 700; font-size: .82rem; color: var(--kc); }
.gt-lab b { display: inline-grid; place-items: center; width: 1.3rem; height: 1.3rem; border-radius: 50%; background: var(--kc); color: #fff; font-size: .7rem; }
.gt-row textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: .45rem .55rem; font-size: .9rem; resize: vertical; background: #fff; line-height: 1.45; }
.gt-row textarea:focus { outline: 2px solid var(--kc); border-color: transparent; }
.gt-preview { white-space: pre-wrap; background: #0F2547; color: #E8F0FB; border-radius: 12px; padding: 1rem; font-size: .9rem; line-height: 1.55; min-height: 8rem; font-family: var(--font); position: relative; }
.gt-ckbox { position: relative; margin-top: 1.2rem; padding: 1rem 1.1rem; border-radius: 12px; background: var(--sunk); border: 1px solid var(--line); }
.gt-ckbox h4 { display: flex; align-items: center; gap: .4rem; margin-bottom: .3rem; }
.gt-ckbox h4 .ico { width: 20px; height: 20px; color: var(--brand); }
.gt-check { list-style: none; margin: .6rem 0 0; padding: 0; display: grid; gap: .45rem; }
.gt-check li { display: flex; gap: .6rem; align-items: flex-start; font-size: .93rem; }
.gt-check input { width: 1.3rem; height: 1.3rem; accent-color: var(--k3); flex-shrink: 0; margin-top: .15rem; }
.gt-meter { height: 8px; border-radius: 99px; background: #fff; border: 1px solid var(--line); overflow: hidden; margin: .4rem 0; }
.gt-meter span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--sun), var(--k3)); transition: width .4s; }
.gt-meter.full span { background: var(--k3); }
@media (max-width: 760px) { .gt-grid { grid-template-columns: 1fr; } .gt-tabs { grid-template-columns: 1fr; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Thẻ quẹt ---------- */
.sw-bar { height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; margin-bottom: .8rem; }
.sw-bar span { display: block; height: 100%; background: var(--brand); transition: width .3s; width: 0; }
.sw-deck { position: relative; height: 210px; max-width: 520px; margin: 0 auto 1rem; }
.sw-card { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: .4rem; padding: 1.2rem 1.4rem; background: #fff; border: 2px solid var(--line); border-radius: 18px; box-shadow: 0 16px 32px -22px rgba(15,37,71,.6); transform: translateY(calc(var(--k) * 10px)) scale(calc(1 - var(--k) * .05)); transition: transform .45s cubic-bezier(.3,.7,.3,1), opacity .45s; z-index: calc(10 - var(--k)); }
.sw-card.back { opacity: calc(1 - var(--k) * .3); }
.sw-card .sw-ico { width: 40px; height: 40px; color: var(--brand); }
.sw-t { font-weight: 700; font-size: 1.08rem; margin: 0; }
.sw-sub { font-size: .85rem; color: var(--ink-3); margin: 0; }
.sw-card.fly-l { transform: translateX(-130%) rotate(-18deg); opacity: 0; }
.sw-card.fly-r { transform: translateX(130%) rotate(18deg); opacity: 0; }
.sw-card.fly-u { transform: translateY(-120%) scale(.9); opacity: 0; }
.sw-card.is-ok { border-color: var(--k3); background: #E9F8F1; }
.sw-card.is-bad { border-color: var(--seal); background: var(--seal-soft); }
.sw-btns { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: .5rem; max-width: 620px; margin: 0 auto; }
.sw-btn { display: flex; align-items: center; justify-content: center; gap: .4rem; min-height: 52px; border-radius: 14px; border: 2px solid; font-weight: 700; font-size: .92rem; background: #fff; line-height: 1.2; padding: .4rem .5rem; transition: transform .1s; }
.sw-btn:active { transform: scale(.96); }
.sw-btn .ico { width: 20px; height: 20px; flex-shrink: 0; }
.sw-btn.tone-l0 { color: var(--k3); border-color: var(--k3); } .sw-btn.tone-l0:hover { background: #E9F8F1; }
.sw-btn.tone-l2 { color: var(--warn); border-color: var(--warn); } .sw-btn.tone-l2:hover { background: var(--warn-soft); }
.sw-btn.tone-l3 { color: var(--seal); border-color: var(--seal); } .sw-btn.tone-l3:hover { background: var(--seal-soft); }
.sw-btn.tone-l1 { color: var(--brand); border-color: var(--brand); }
.sw-fb { max-width: 620px; margin: .8rem auto 0; min-height: 1.5rem; font-size: .94rem; }
.sw-end { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }

/* ---------- Sắp xếp thứ tự ---------- */
.ord { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; max-width: 680px; }
.ord-it { display: flex; align-items: center; gap: .7rem; padding: .6rem .7rem; background: #fff; border: 2px solid var(--line); border-radius: 12px; transition: all .3s; }
.ord-n { display: inline-grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%; background: var(--navy-soft); color: var(--brand); font-weight: 800; flex-shrink: 0; }
.ord-ico { width: 32px; height: 32px; padding: 6px; border-radius: 9px; background: var(--sunk); color: var(--ink-2); flex-shrink: 0; }
.ord-t { flex: 1; min-width: 0; }
.ord-t small { display: block; color: var(--ink-2); font-weight: 400; font-size: .86rem; margin-top: .15rem; }
.ord-mv { display: flex; gap: .2rem; }
.ord-mv .icon-btn { width: 40px; height: 40px; font-size: 1rem; background: var(--sunk); color: var(--ink-2); }
.ord-mv .icon-btn:hover:not(:disabled) { background: var(--navy-soft); color: var(--brand); }
.ord-mv .icon-btn:disabled { opacity: .3; }
.ord-it.ok { border-color: var(--k3); } .ord-it.ok .ord-n { background: var(--k3); color: #fff; }
.ord-it.bad { border-color: var(--seal); background: var(--seal-soft); }
.ord-it.solved { animation: pop .45s calc(var(--d) * .15s) both; }
@keyframes pop { 0% { transform: scale(.94); opacity: .4; } 60% { transform: scale(1.03); } 100% { transform: none; opacity: 1; } }

/* ---------- Mô phỏng điện thoại ---------- */
.ps-tabs { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
.ps-tab { display: inline-flex; align-items: center; gap: .5rem; padding: .4rem .9rem .4rem .4rem; border-radius: 999px; border: 2px solid var(--line); background: #fff; font-weight: 700; }
.ps-tab[aria-selected="true"] { border-color: var(--ac); color: var(--ac); box-shadow: 0 6px 16px -10px var(--ac); }
.ps-logo { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; color: #fff; font-weight: 800; }
.ps-wrap { display: grid; grid-template-columns: 260px 1fr; gap: 1.6rem; align-items: center; }
.ps-phone { position: relative; width: 250px; height: 470px; border-radius: 36px; background: #10161F; padding: 12px; box-shadow: 0 24px 40px -24px rgba(0,0,0,.6), inset 0 0 0 2px #2A3340; margin: 0 auto; }
.ps-notch { position: absolute; top: 14px; left: 50%; width: 80px; height: 18px; margin-left: -40px; border-radius: 0 0 12px 12px; background: #10161F; z-index: 2; }
.ps-scr { position: relative; height: 100%; border-radius: 26px; background: #F5F7FA; overflow: hidden; display: flex; flex-direction: column; }
.ps-status { display: flex; justify-content: space-between; padding: 8px 16px 4px; font-size: .62rem; font-weight: 700; color: #333; }
.ps-head { display: flex; align-items: center; gap: .5rem; padding: .55rem .8rem; background: var(--ac); color: #fff; font-size: .82rem; animation: slideIn .35s ease both; }
.ps-back { font-size: 1.2rem; line-height: 1; }
.ps-body { padding: .5rem; display: grid; gap: .35rem; animation: slideIn .35s .05s ease both; }
@keyframes slideIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
.ps-row { position: relative; display: flex; align-items: center; gap: .5rem; padding: .55rem .6rem; background: #fff; border-radius: 10px; font-size: .74rem; line-height: 1.3; color: #222; border: 1.5px solid transparent; }
.ps-ri { width: 18px; height: 18px; border-radius: 6px; background: #E3E8EF; flex-shrink: 0; }
.ps-row.tap { border-color: var(--ac); }
.ps-row.tap::after { content: ""; position: absolute; right: 14px; top: 50%; width: 26px; height: 26px; margin-top: -13px; border-radius: 50%; background: rgba(245,180,0,.55); box-shadow: 0 0 0 0 rgba(245,180,0,.6); animation: tapr 1.4s infinite; }
.ps-row.tap.pressed { background: color-mix(in srgb, var(--ac) 10%, #fff); }
@keyframes tapr { 0% { box-shadow: 0 0 0 0 rgba(245,180,0,.6); transform: scale(.8); } 70% { box-shadow: 0 0 0 14px rgba(245,180,0,0); transform: scale(1); } 100% { box-shadow: 0 0 0 0 rgba(245,180,0,0); transform: scale(.8); } }
.ps-sw { margin-left: auto; width: 34px; height: 20px; border-radius: 99px; background: #C9D1DC; position: relative; transition: background .3s .5s; flex-shrink: 0; }
.ps-sw i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .3s .5s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.ps-row.pressed .ps-sw { background: #22B573; } .ps-row.pressed .ps-sw i { left: 16px; }
.ps-row.tap:has(.ps-sw)::after { right: 52px; }
.ps-done { display: flex; align-items: center; gap: .5rem; justify-content: center; margin-top: .6rem; padding: .7rem; border-radius: 12px; background: #E3F7EC; color: #0B8A5F; font-weight: 800; font-size: .85rem; animation: pop .5s .5s both; }
.ps-done .ico { width: 28px; height: 28px; }
.ps-cap { min-height: 7rem; }
.ps-step { font-weight: 700; color: var(--brand); margin-bottom: .2rem; }
.ps-t { font-size: 1.12rem; font-weight: 600; }
.ps-dots { display: flex; gap: .4rem; margin: .3rem 0; }
.ps-dot { width: 12px; height: 12px; border-radius: 50%; border: 0; background: var(--line-2); padding: 0; }
.ps-dot.on { background: var(--brand); width: 28px; border-radius: 99px; transition: width .3s; }
@media (max-width: 640px) { .ps-wrap { grid-template-columns: 1fr; gap: 1rem; } .ps-phone { width: 230px; height: 420px; } .ps-cap { min-height: 0; } }

/* ---------- Soi chi tiết ---------- */
.spot { position: relative; }
.spot .sp { outline: 1px dashed transparent; }
.spot .sp:hover { background: #FFF4CC; }
.spot .sp.mk { background: #FFE7A3; box-shadow: 0 0 0 2px var(--sun); }
.spot .sp.hit { background: var(--safe-soft); box-shadow: 0 0 0 2px var(--k3); }
.spot .sp.miss { background: var(--seal-soft); box-shadow: 0 0 0 2px var(--seal); animation: spblink 1s 2; }
.spot .sp.fp { background: #EEF1F5; box-shadow: 0 0 0 2px var(--ink-3); text-decoration: line-through; }
@keyframes spblink { 50% { box-shadow: 0 0 0 5px rgba(201,42,42,.25); } }
.spot-why { padding-left: 1.3rem; display: grid; gap: .4rem; font-size: .93rem; }
.spot-why li.ok::marker { color: var(--k3); } .spot-why li.bad::marker { color: var(--seal); }
.spot-doc { background: #fff; border: 1px solid var(--line-2); box-shadow: 0 14px 30px -24px rgba(0,0,0,.5); padding: 1.6rem 1.8rem; font-family: "Times New Roman", Times, serif; font-size: 1rem; line-height: 1.5; max-width: 720px; margin: 0 auto; }
.spot-doc p { margin: 0 0 .5rem; }
.sd-head, .sd-foot { display: grid; grid-template-columns: 1fr 1.3fr; gap: 1rem; text-align: center; font-size: .86rem; margin-bottom: 1rem; }
.sd-foot { margin-top: 1rem; text-align: left; } .sd-foot > div:last-child { text-align: center; }
.sd-t { text-align: center; margin: .8rem 0 1rem !important; }
.spot-table .dt { min-width: 520px; }
.spot-table td, .spot-table th { white-space: nowrap; }
.sms-ph { max-width: 340px; margin: 0 auto; background: #F2F4F7; border-radius: 24px; padding: 1rem; border: 8px solid #10161F; }
.sms-top { display: flex; flex-direction: column; align-items: center; font-weight: 800; margin-bottom: .8rem; }
.sms-top small { font-weight: 400; color: var(--ink-3); }
.sms-b { background: #E4E7EC; border-radius: 16px 16px 16px 4px; padding: .8rem .9rem; font-size: .95rem; line-height: 1.55; }
.sms-link { color: #0B63CE; text-decoration: underline; word-break: break-all; }
.bx-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.bx-tag { display: inline-block; background: var(--seal); color: #fff; font-weight: 800; padding: .15rem .7rem; border-radius: 6px; margin-bottom: .4rem; }
.bx-tag.ok { background: var(--k3); }
.bx-ph { background: #fff; border: 6px solid #10161F; border-radius: 22px; padding: 1rem .8rem; text-align: center; font-size: .86rem; }
.bx-ph p { margin: 0 0 .4rem; }
.bx-ph.dark { background: #1E2A3B; color: #fff; }
.bx-bank { font-weight: 800; color: #0B8A5F; }
.bx-ph.dark .bx-bank { color: #7FE0B3; }
.bx-ok { font-size: 1.6rem; color: #0B8A5F; }
.bx-amt { font-weight: 800; font-size: 1rem; }
.bx-l { color: var(--ink-3); text-align: left; border-bottom: 1px solid var(--line); padding-bottom: .2rem; }
.bx-ph.dark .bx-l { color: #B9C5D6; border-color: #33435A; }
.bx-note { margin: .8rem 0 0; font-size: .9rem; font-weight: 600; color: var(--warn); }
@media (max-width: 560px) { .bx-wrap { grid-template-columns: 1fr; } .spot-doc { padding: 1rem; font-size: .92rem; } .sd-head, .sd-foot { grid-template-columns: 1fr; } }

/* ---------- Cuộc đua 15 phút ---------- */
.dl-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
.dl-boss { display: flex; align-items: center; gap: .6rem; background: #FFF4D6; border: 1px solid #F3D27A; border-radius: 16px 16px 16px 4px; padding: .7rem 1rem; font-weight: 600; max-width: 460px; }
.dl-boss .ico { width: 26px; height: 26px; color: #9A6B00; flex-shrink: 0; }
.dl-clk { position: relative; width: 120px; height: 120px; }
.dl-ring { width: 120px; height: 120px; transform: rotate(-90deg); }
.dl-bg { fill: none; stroke: var(--navy-soft); stroke-width: 10; }
.dl-fg { fill: none; stroke: var(--brand); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 327; stroke-dashoffset: 0; transition: stroke-dashoffset .1s linear, stroke .3s; }
.dl-clk.hot .dl-fg { stroke: var(--seal); }
.dl-clk.hot { animation: shakeS .3s infinite; }
@keyframes shakeS { 0%,100% { transform: none; } 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } }
.dl-clock { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.dl-time { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink); }
.dl-clk.hot .dl-time { color: var(--seal); }
.dl-clock small { color: var(--ink-3); font-size: .75rem; }
.dl-lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.dl-lane { position: relative; padding: 1rem; border-radius: 14px; border: 2px solid var(--line); background: var(--sunk); }
.dl-lane h4 { font-size: .95rem; }
.dl-doc { background: #fff; border-radius: 8px; padding: .7rem; display: grid; gap: 6px; box-shadow: 0 6px 16px -12px rgba(0,0,0,.4); }
.dl-doc i { display: block; height: 8px; border-radius: 4px; background: #E8EDF4; transition: background .2s; }
.dl-doc i:nth-child(odd) { width: 92%; } .dl-doc i:nth-child(3n) { width: 70%; }
.dl-doc i.on { background: #9DB8DA; }
.dl-lane.dl-ai .dl-doc i.on { background: #8FC3F5; }
.dl-doc i.chk { background: var(--k3) !important; }
.dl-bar { height: 6px; border-radius: 99px; background: #fff; margin: .7rem 0 .4rem; overflow: hidden; }
.dl-bar span { display: block; height: 100%; width: 0; background: var(--ink-3); }
.dl-lane.dl-ai .dl-bar span { background: var(--brand); }

        { type: 'part', t: 'Phần 2. Đóng vai xử lý tình huống' },
        { type: 'widget', name: 'roleplay', title: 'Mô phỏng đóng vai: chọn tình huống, trả lời người dân', intro: 'Chọn một người dân. Với mỗi câu người dân nói, chọn cách trả lời của cán bộ. Trả lời đúng cả 3 lượt để nhận đủ 3 trái tim.', opts: { cases: [
          { ava: '👵', who: 'Bà Tư, 78 tuổi', tag: 'Không có điện thoại thông minh', ctx: 'Bà cần làm thủ tục nhưng chỉ có điện thoại “cục gạch”, nghe nói giờ cái gì cũng phải làm trên mạng.',

            turns: [
              { say: '“Con ơi, bà không có điện thoại xịn, vậy bà có làm giấy tờ được không con?”', opts: [

                { t: '“Để con lấy tài khoản VNeID của con nộp giùm bà cho nhanh.”', ok: false, why: 'Sai: tài khoản định danh điện tử là của từng cá nhân, không dùng tài khoản của người khác.' } ] },
              { say: '“Con cháu bà nói làm cái định danh mức 2 cho bà, làm ở đâu con?”', opts: [

                { t: '“Bà đưa con số căn cước, con nhập lên ChatGPT hỏi giùm.”', ok: false, why: 'Sai: không đưa số căn cước của người dân lên AI.' },
                { t: '“Cái đó bà tải ứng dụng nào cũng làm được.”', ok: false, why: 'Sai: chỉ dùng ứng dụng VNeID chính thức; mức 2 cần xác minh tại công an.' } ] },
              { say: '“Bà hay quên lắm, con giữ giùm bà cái mật khẩu nghen.”', opts: [

                { t: '“Dạ con không giữ được bà. Bà nhờ con cháu tin cậy cất giữ giúp, hoặc nếu quên thì dùng chức năng lấy lại mật khẩu, con chỉ bà.”', ok: true, why: 'Đúng nguyên tắc, vẫn có cách hỗ trợ.' },
                { t: '“Bà dán mật khẩu sau lưng điện thoại cho dễ nhớ.”', ok: false, why: 'Sai: ai cầm máy cũng đọc được.' } ] }

          { ava: '👨‍🌾', who: 'Chú Năm, 62 tuổi', tag: 'Chưa quen thao tác', ctx: 'Chú cầm điện thoại đưa cho cán bộ, muốn kích hoạt VNeID.',

                { t: '“Chú đặt ngày sinh cho dễ nhớ.”', ok: false, why: 'Sai: ngày sinh dễ đoán.' } ] }

          { ava: '👩', who: 'Cô Hạnh, 45 tuổi', tag: 'Hồ sơ bị yêu cầu bổ sung', ctx: 'Cô nộp hồ sơ trực tuyến tuần trước, nay nhận thông báo hồ sơ cần bổ sung, cô rất bực.',
            lesson: 'Tra cứu bằng mã hồ sơ để xem lý do; bổ sung đúng thành phần, ảnh rõ nét; ghi lại mã hồ sơ để theo dõi.',
            turns: [

              { say: '“Ghi là ảnh giấy tờ không rõ. Tôi chụp bằng điện thoại mà.”', opts: [
                { t: '“Dạ mình chụp lại nơi đủ sáng, đặt giấy tờ trên mặt phẳng, rõ 4 góc, không lóa rồi tải lên bổ sung.”', ok: true, why: 'Hướng dẫn cụ thể cách chụp đạt yêu cầu.' },
                { t: '“Cô gửi ảnh qua Zalo con, con nộp giùm.”', ok: false, why: 'Không nhận giấy tờ cá nhân qua tin nhắn cá nhân.' },
                { t: '“Cô scan bằng máy lớn mới được.”', ok: false, why: 'Không cần thiết; ảnh chụp rõ nét là đủ.' } ] },
              { say: '“Bổ sung xong rồi, sao biết khi nào có kết quả?”', opts: [
                { t: '“Dạ cô lưu mã hồ sơ, vào Cổng Dịch vụ công tra cứu trạng thái, khi có kết quả sẽ xem được trong mục hồ sơ của mình.”', ok: true, why: 'Hướng dẫn tự theo dõi bằng mã hồ sơ.' },

          { ava: '👴', who: 'Chú Bảy, 68 tuổi', tag: 'Nhận tin nhắn lạ', ctx: 'Chú nhận tin nhắn “BHYT sắp bị khóa”, có đường link, hỏi cán bộ có bấm vào không.',

            turns: [

          { ava: '🧑‍💼', who: 'Anh Tám, hộ kinh doanh', tag: 'Bán hàng online', ctx: 'Anh bán đặc sản qua Zalo, khách lạ gửi ảnh chuyển khoản 3 triệu, giục giao hàng ngay.',

                { t: '“Anh bật xác thực 2 lớp: Cá nhân → Cài đặt → Tài khoản và bảo mật → Xác thực 2 lớp, và dùng mật khẩu mạnh.”', ok: true, why: 'Đúng các bước trong bài.' },

            ] }
        ] } },

  document.getElementById('backdrop').addEventListener('click', function () { setNav(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && document.body.classList.contains('nav-open')) { setNav(false); menuBtn.focus(); } });

  /* Thanh chuyển trang dưới cùng trên điện thoại */
  const bnav = document.getElementById('bottom-nav');
  function label(r) {
    const L = { '': 'Giới thiệu', 'khao-sat': 'Khảo sát', 'kiem-tra': 'Kiểm tra', 'thu-vien-prompt': 'Câu lệnh mẫu', 'so-tay': 'Sổ tay', 'phap-ly': 'Pháp lý' };
    if (r in L) return L[r];
    const m = /^chuyen-de\/(\d)$/.exec(r); return m ? 'Chuyên đề ' + m[1] : '';
  }
  function bottomNav() {
    const r = route(), i = order.indexOf(r);
    bnav.innerHTML = '';
    const prev = i > 0 ? order[i - 1] : null, next = i >= 0 && i < order.length - 1 ? order[i + 1] : null;
    bnav.append(
      prev != null ? h('a', { class: 'bn-btn bn-prev', href: '#/' + prev }, h('small', {}, 'Trước'), label(prev)) : h('span', { class: 'bn-btn bn-empty' }),
      h('button', { class: 'bn-btn bn-menu', type: 'button', onclick: function () { setNav(!document.body.classList.contains('nav-open')); } }, h('small', {}, 'Mục lục'), label(r) || 'Trang'),
      next != null ? h('a', { class: 'bn-btn bn-next', href: '#/' + next }, h('small', {}, 'Tiếp'), label(next)) : h('span', { class: 'bn-btn bn-empty' }));
  }
  const pj = document.getElementById('projector-btn');
  function setPj(on) { document.body.classList.toggle('projector', on); pj.setAttribute('aria-pressed', String(on)); U.store.set('projector', on); }
  pj.addEventListener('click', function () { setPj(!document.body.classList.contains('projector')); });
  setPj(!!U.store.get('projector', false));

  document.addEventListener('keydown', function (e) {
    if (e.target.closest('input, textarea, select, [contenteditable]') || e.altKey || e.ctrlKey || e.metaKey) return;
    const i = order.indexOf(route());
    if (e.key === 'ArrowRight' && i >= 0 && i < order.length - 1) location.hash = '#/' + order[i + 1];
    if (e.key === 'ArrowLeft' && i > 0) location.hash = '#/' + order[i - 1];
  });
  window.addEventListener('hashchange', go);
  A.app = { go: go, refreshNav: nav };
  go();

  /* Lưu đệm để dùng khi mạng yếu (chỉ khi chạy qua http/https) */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
  }
})(window.ATTT);

</script>
